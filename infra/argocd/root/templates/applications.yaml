apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: {{ .Values.versions.lbController | quote }}
    helm:
      valuesObject:
        clusterName: {{ .Values.clusterName | quote }}
        region: {{ .Values.region | quote }}
        vpcId: {{ .Values.vpcId | quote }}
        replicaCount: 1
        enableServiceMutatorWebhook: false
        enableBackendSecurityGroup: false
        serviceAccount:
          name: aws-load-balancer-controller
          annotations:
            eks.amazonaws.com/role-arn: {{ .Values.roles.lbController | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: {{ .Values.versions.externalSecrets | quote }}
    helm:
      valuesObject:
        serviceAccount:
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: {{ .Values.roles.externalSecrets | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
