apiVersion: v1
kind: Namespace
metadata:
  name: aws-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kmo-store
  namespace: aws-demo
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.storeRole | quote }}
---
apiVersion: kmo.isntall.net/v1alpha1
kind: ConfigStore
metadata:
  name: default
  namespace: aws-demo
spec:
  s3:
    bucket: {{ .Values.bucket | quote }}
    region: {{ .Values.region | quote }}
    serviceAccountRef:
      name: kmo-store
---
apiVersion: kmo.isntall.net/v1alpha1
kind: ConfigSync
metadata:
  name: hello
  namespace: aws-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: aws-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: hello }
  template:
    metadata:
      labels: { app: hello }
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.37.0
          command: ["sh", "-c", "env | grep -E '^(GREETING|REGION)=' | sort; while true; do sleep 3600; done"]
          envFrom:
            - configMapRef: { name: hello-kmo }
            - secretRef: { name: hello-kmo }
