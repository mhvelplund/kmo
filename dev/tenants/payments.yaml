apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
apiVersion: v1
kind: Secret
metadata:
  name: payments-store-credentials
  namespace: payments
stringData:
  accessKeyId: kmoadmin
  secretAccessKey: kmo-local-secret
---
apiVersion: kmo.isntall.net/v1alpha1
kind: ConfigStore
metadata:
  name: default
  namespace: payments
spec:
  s3:
    bucket: kmo-tenant
    region: us-east-1
    endpoint: http://rustfs.kmo-dev.svc:9000
    addressingStyle: Path
    credentialsSecretRef:
      name: payments-store-credentials
---
apiVersion: kmo.isntall.net/v1alpha1
kind: ConfigSync
metadata:
  name: ledger
  namespace: payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.37.0
          command: ["sh", "-c"]
          args:
            - |
              env | grep -E '^(GREETING|LOG_LEVEL|REGION)=' | sort
              while true; do sleep 3600; done
          envFrom:
            - configMapRef:
                name: ledger-kmo
            - secretRef:
                name: ledger-kmo
