apiVersion: v1
kind: Namespace
metadata:
  name: partners
---
apiVersion: v1
kind: Secret
metadata:
  name: partners-store-credentials
  namespace: kmo-system
stringData:
  accessKeyId: kmoadmin
  secretAccessKey: kmo-local-secret
---
apiVersion: kmo.isntall.net/v1alpha1
kind: ClusterConfigStore
metadata:
  name: partners
spec:
  s3:
    bucket: kmo-config
    keyPrefix: partners-store
    region: us-east-1
    endpoint: http://rustfs.kmo-dev.svc:9000
    addressingStyle: Path
    credentialsSecretRef:
      name: partners-store-credentials
      namespace: kmo-system
  allowedNamespaces: [partners]
---
apiVersion: kmo.isntall.net/v1alpha1
kind: ConfigSync
metadata:
  name: portal
  namespace: partners
spec:
  sources:
    - storeRef:
        kind: ClusterConfigStore
        name: partners
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: partners
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.37.0
          command: ["sh", "-c"]
          args:
            - |
              env | grep -E '^(GREETING|LOG_LEVEL|REGION)=' | sort
              while true; do sleep 3600; done
          envFrom:
            - configMapRef:
                name: portal-kmo
            - secretRef:
                name: portal-kmo
