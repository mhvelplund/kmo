apiVersion: v1
kind: Secret
metadata:
  name: rustfs-root
  namespace: kmo-dev
stringData:
  accessKey: kmoadmin
  secretKey: kmo-local-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: kmo-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.1
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-root
                  key: accessKey
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-root
                  key: secretKey
            - name: RUSTFS_NOTIFY_ENABLE
              value: "true"
            - name: RUSTFS_NOTIFY_WEBHOOK_ENABLE_PRIMARY
              value: "on"
            - name: RUSTFS_NOTIFY_WEBHOOK_ENDPOINT_PRIMARY
              value: http://kmo-receiver.kmo-system.svc:8080/events/rustfs
            - name: RUSTFS_NOTIFY_WEBHOOK_AUTH_TOKEN_PRIMARY
              value: kmo-local-token
            - name: RUSTFS_NOTIFY_WEBHOOK_QUEUE_DIR_PRIMARY
              value: /tmp/notify-primary
            - name: RUSTFS_OUTBOUND_ALLOW_ORIGINS
              value: http://kmo-receiver.kmo-system.svc:8080
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: s3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: kmo-dev
spec:
  type: NodePort
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
      nodePort: 30900
