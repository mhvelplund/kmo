apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: shop
spec:
  clusterIP: None
  selector:
    app: inventory
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inventory
  namespace: shop
spec:
  serviceName: inventory
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.37.0
          command: ["sh", "-c"]
          args:
            - |
              env | grep -E '^(GREETING|LOG_LEVEL|REGION|DB_PASSWORD|SHARED_API_TOKEN)=' | sort
              while true; do sleep 3600; done
          envFrom:
            - configMapRef:
                name: inventory-kmo
            - secretRef:
                name: inventory-kmo
