apiVersion: v1
kind: ServiceAccount
metadata:
  name: kmo-receiver
  namespace: kmo-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kmo-receiver
rules:
  - apiGroups: [kmo.isntall.net]
    resources: [configsyncs]
    verbs: [get, list, watch, patch]
  - apiGroups: [kmo.isntall.net]
    resources: [configstores, clusterconfigstores]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kmo-receiver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kmo-receiver
subjects:
  - kind: ServiceAccount
    name: kmo-receiver
    namespace: kmo-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kmo-receiver
  namespace: kmo-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kmo-receiver
  template:
    metadata:
      labels:
        app: kmo-receiver
    spec:
      serviceAccountName: kmo-receiver
      terminationGracePeriodSeconds: 10
      {{- with .Values.receiver.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: receiver
          image: {{ include "kmo.image" (dict "root" . "image" .Values.receiver.image) }}
          imagePullPolicy: {{ .Values.receiver.image.pullPolicy }}
          env:
            - name: KMO_RECEIVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.receiver.tokenSecret.name }}
                  key: {{ .Values.receiver.tokenSecret.key }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.receiver.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: kmo-receiver
  namespace: kmo-system
spec:
  selector:
    app: kmo-receiver
  ports:
    - name: http
      port: 8080
      targetPort: http
