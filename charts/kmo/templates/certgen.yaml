{{- define "kmo.certgen.annotations" -}}
{{- if .hook }}
  annotations:
    helm.sh/hook: {{ .hook }}
    helm.sh/hook-weight: {{ .weight | quote }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
{{- end }}
{{- end -}}

{{- define "kmo.certgen.access" -}}
{{- $name := printf "kmo-certgen-%s" .command -}}
{{- $early := dict "hook" .hook "weight" "-5" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: pepr-system
  {{- include "kmo.certgen.annotations" $early }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: pepr-system
  {{- include "kmo.certgen.annotations" $early }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [pepr-kmo-tls, pepr-kmo-api-path]
    verbs: [get]
  {{- if ne .command "patch" }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  {{- end }}
  {{- if eq .command "renew" }}
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [pepr-kmo-tls]
    verbs: [delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, delete]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: pepr-system
  {{- include "kmo.certgen.annotations" $early }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: pepr-system
{{- if ne .command "create" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  {{- include "kmo.certgen.annotations" $early }}
rules:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations]
    resourceNames: [pepr-kmo]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  {{- include "kmo.certgen.annotations" $early }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: pepr-system
{{- end }}
{{- end -}}

{{- define "kmo.certgen.pod" -}}
serviceAccountName: kmo-certgen-{{ .command }}
restartPolicy: Never
{{- with .root.Values.certgen.imagePullSecrets }}
imagePullSecrets:
  {{- range . }}
  - name: {{ . }}
  {{- end }}
{{- end }}
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
containers:
  - name: certgen
    image: {{ include "kmo.image" (dict "root" .root "image" .root.Values.certgen.image) }}
    imagePullPolicy: {{ .root.Values.certgen.image.pullPolicy }}
    args: [{{ .command | quote }}]
    env:
      - name: KMO_CERTIFICATE_DAYS
        value: {{ .root.Values.certgen.certificateDays | quote }}
      - name: KMO_RENEW_BEFORE_DAYS
        value: {{ .root.Values.certgen.renewBeforeDays | quote }}
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
{{- end -}}

{{- range $command, $hook := dict "create" "pre-install,pre-upgrade" "patch" "post-install,post-upgrade" }}
{{ include "kmo.certgen.access" (dict "command" $command "hook" $hook) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kmo-certgen-{{ $command }}
  namespace: pepr-system
  {{- include "kmo.certgen.annotations" (dict "hook" $hook "weight" "0") }}
spec:
  backoffLimit: 3
  template:
    spec:
      {{- include "kmo.certgen.pod" (dict "root" $ "command" $command) | nindent 6 }}
---
{{- end }}
{{ include "kmo.certgen.access" (dict "command" "renew") }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kmo-certgen-renew
  namespace: pepr-system
spec:
  schedule: {{ .Values.certgen.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          {{- include "kmo.certgen.pod" (dict "root" . "command" "renew") | nindent 10 }}
