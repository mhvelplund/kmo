[tools]
node = "24.21.0"
kubectl = "1.37.1"
k3d = "5.9.0"
pre-commit = "4.6.2"
aws-cli = "2.37.12"
jq = "1.8.2"
shellcheck = "0.11.0"
shfmt = "3.14.1"
usage = "6.12.1"
helm = "4.3.0"
yq = "4.54.1"
uv = "0.13.0"
terraform = "1.16.5"
terragrunt = "1.1.6"

[env]
KUBECONFIG = "{{config_root}}/.kube/config"

[tasks.setup]
description = "Install dependencies and Git hooks"
run = ["npm install", "pre-commit install", "pre-commit install --hook-type commit-msg"]

[tasks.lint]
description = "Run every static check"
run = [
  "npm run lint",
  "npm run format:check",
  "npm run lint:md",
  "npm run typecheck",
  "git ls-files -co --exclude-standard '*.sh' | xargs shellcheck",
  "git ls-files -co --exclude-standard '*.sh' | xargs shfmt --diff",
  "terraform fmt -check -recursive infra",
  "terragrunt hcl format --check --exclude-dir .terraform --exclude-dir .terragrunt-cache --working-dir infra",
]

[tasks.format]
description = "Rewrite files with Prettier and the shell scripts with shfmt"
run = ["npm run format", "git ls-files -co --exclude-standard '*.sh' | xargs shfmt --write"]

[tasks."cluster:up"]
description = "Create the local k3d cluster and its image registry"
run = [
  "mkdir -p .kube",
  "k3d cluster create --config dev/k3d.yaml --wait ${KMO_OIDC_ISSUER:+--k3s-arg=--kube-apiserver-arg=service-account-issuer=$KMO_OIDC_ISSUER@server:0 --k3s-arg=--kube-apiserver-arg=service-account-jwks-uri=$KMO_OIDC_ISSUER/openid/v1/jwks@server:0}",
]

[tasks."cluster:down"]
description = "Delete the local k3d cluster and its image registry"
run = "k3d cluster delete --config dev/k3d.yaml"

[tasks.deploy]
description = "Install the local environment into the cluster, after kmo:deploy"
run = [
  "kubectl apply --server-side -k dev/argo-rollouts",
  "kubectl wait --for=condition=Established crd/rollouts.argoproj.io --timeout=60s",
  "kubectl delete job store-seed -n kmo-dev --ignore-not-found",
  "kubectl apply -k dev",
  "kubectl rollout status deployment/rustfs -n kmo-dev --timeout=180s",
  "kubectl wait --for=condition=Complete job/store-seed -n kmo-dev --timeout=180s",
  "kubectl rollout status deployment/orders-api -n shop --timeout=180s",
]

[tasks.store]
description = "Run an AWS CLI command against the local object store, e.g. mise run store -- s3 ls"
run = "aws"

[tasks.store.env]
AWS_CONFIG_FILE = "{{config_root}}/dev/aws-config"
AWS_PROFILE = "default"
AWS_ACCESS_KEY_ID = "kmoadmin"
AWS_SECRET_ACCESS_KEY = "kmo-local-secret"

[tasks.test]
description = "Run the unit tests"
run = "npm test"

[tasks."kmo:deploy"]
description = "Build KMO from the working tree and install it into the cluster with the chart"
run = [
  "npm run build --workspace @kmo/receiver",
  "docker build --quiet -t localhost:5111/kmo-receiver:dev packages/receiver",
  "docker push --quiet localhost:5111/kmo-receiver:dev",
  "npm run build --workspace @kmo/certgen",
  "docker build --quiet -t localhost:5111/kmo-certgen:dev packages/certgen",
  "docker push --quiet localhost:5111/kmo-certgen:dev",
  "charts/build.sh",
  "helm upgrade --install kmo dist/chart/kmo --namespace pepr-system --create-namespace --values dev/kmo/values.yaml",
  "kubectl wait --for=condition=Established --timeout=60s crd/configsyncs.kmo.isntall.net crd/configstores.kmo.isntall.net crd/clusterconfigstores.kmo.isntall.net",
  "kubectl apply -f dev/kmo/receiver-token.yaml",
  "kubectl rollout restart deployment/kmo-receiver -n kmo-system",
  "kubectl rollout status deployment/pepr-kmo -n pepr-system --timeout=180s",
  "kubectl rollout status deployment/pepr-kmo-watcher -n pepr-system --timeout=180s",
  "kubectl rollout status deployment/kmo-receiver -n kmo-system --timeout=120s",
]

[tasks."chart:build"]
description = "Build the Helm chart of KMO into dist/chart/kmo"
run = "charts/build.sh"

[tasks."operator:logs"]
description = "Show the last ten minutes of the operator's watcher log"
run = "kubectl logs -n pepr-system deployment/pepr-kmo-watcher --since=10m"

[tasks."receiver:logs"]
description = "Show the last ten minutes of the receiver's log"
run = "kubectl logs -n kmo-system deployment/kmo-receiver --since=10m"

[tasks."aws:issuer"]
description = "Create the bucket for the cluster's public signing keys in AWS and print the issuer address"
run = "test/e2e/aws/issuer.sh"

[tasks."aws:setup"]
description = "Prove a store without stored keys against a real AWS account (creates AWS resources)"
run = "test/e2e/aws/setup.sh"

[tasks."aws:teardown"]
description = "Remove everything aws:issuer and aws:setup created"
run = "test/e2e/aws/teardown.sh"

[tasks."aws:up"]
description = "Create the demo on AWS with Terragrunt, and a kubeconfig for its cluster (creates AWS resources)"
env = { KMO_REPO_URL = "{{ exec(command='git remote get-url origin') }}", KUBECONFIG = "{{config_root}}/.kube/eks" }
run = [
  "terragrunt run --all --non-interactive --backend-bootstrap --working-dir infra/live/demo -- apply",
  "aws eks update-kubeconfig --name kmo-demo --alias kmo-demo --kubeconfig {{config_root}}/.kube/eks",
]

[tasks."aws:down"]
description = "Delete everything that aws:up created, except the state bucket (deletes AWS resources)"
env = { KMO_REPO_URL = "{{ exec(command='git remote get-url origin') }}", KUBECONFIG = "{{config_root}}/.kube/eks" }
run = [
  "terragrunt run --all --non-interactive --working-dir infra/live/demo -- destroy",
  "rm -f {{config_root}}/.kube/eks",
]

[tasks."test:aws"]
description = "Check the demo on AWS: a changed file in S3 rolls a workload in EKS through EventBridge (writes to S3)"
env = { KUBECONFIG = "{{config_root}}/.kube/eks" }
run = "test/e2e/aws-demo.sh"

[tasks."infra:check"]
description = "Validate the Terraform modules and lint the ArgoCD charts; needs no AWS account"
run = [
  "for module in infra/modules/*/; do terraform -chdir=$module init -backend=false -input=false >/dev/null && terraform -chdir=$module validate -no-color || exit 1; done",
  "for chart in infra/argocd/*/; do helm lint --quiet $chart || exit 1; done",
]

[tasks."check:rollout-guard"]
description = "Prove the guarded Rollout watch on the local cluster (removes and reinstalls Argo Rollouts)"
run = "test/e2e/run.sh rollout-guard"

[tasks."test:e2e"]
description = "Run the end-to-end suites on the local cluster; name suites after -- to run only those"
run = "test/e2e/run.sh"

[tasks."docs:wiki"]
description = "Write the pages of docs/ in the form of a GitHub wiki, e.g. mise run docs:wiki -- <dir>"
run = ".github/scripts/wiki.sh"

[tasks.demo]
description = "Change a file in the local store and show the rollout that follows"
run = "dev/demo.sh"
