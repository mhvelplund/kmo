[tools]
node = "24.21.0"
kubectl = "1.37.1"
k3d = "5.9.0"
pre-commit = "4.6.2"
aws-cli = "2.37.12"
jq = "1.8.2"

[env]
KUBECONFIG = "{{config_root}}/.kube/config"

[tasks.setup]
description = "Install dependencies and Git hooks"
run = ["npm install", "pre-commit install"]

[tasks.lint]
description = "Run every static check"
run = ["npm run lint", "npm run format:check", "npm run lint:md", "npm run typecheck"]

[tasks."cluster:up"]
description = "Create the local k3d cluster and its image registry"
run = [
  "mkdir -p .kube",
  "k3d cluster create --config dev/k3d.yaml --wait ${KMO_OIDC_ISSUER:+--k3s-arg=--kube-apiserver-arg=service-account-issuer=$KMO_OIDC_ISSUER@server:0 --k3s-arg=--kube-apiserver-arg=service-account-jwks-uri=$KMO_OIDC_ISSUER/openid/v1/jwks@server:0}",
]

[tasks."cluster:down"]
description = "Delete the local k3d cluster and its image registry"
run = "k3d cluster delete --config dev/k3d.yaml"

[tasks.deploy]
description = "Install the local environment into the cluster"
run = [
  "kubectl apply -f crds/",
  "kubectl wait --for=condition=Established --timeout=60s crd/configsyncs.kmo.isntall.net crd/configstores.kmo.isntall.net crd/clusterconfigstores.kmo.isntall.net",
  "kubectl apply --server-side -k dev/argo-rollouts",
  "kubectl wait --for=condition=Established crd/rollouts.argoproj.io --timeout=60s",
  "kubectl delete job store-seed -n kmo-dev --ignore-not-found",
  "kubectl apply -k dev",
  "kubectl rollout status deployment/rustfs -n kmo-dev --timeout=180s",
  "kubectl wait --for=condition=Complete job/store-seed -n kmo-dev --timeout=180s",
]

[tasks.store]
description = "Run an AWS CLI command against the local object store, e.g. mise run store -- s3 ls"
run = "aws"

[tasks.store.env]
AWS_CONFIG_FILE = "{{config_root}}/dev/aws-config"
AWS_PROFILE = "default"
AWS_ACCESS_KEY_ID = "kmoadmin"
AWS_SECRET_ACCESS_KEY = "kmo-local-secret"

[tasks.test]
description = "Run the unit tests"
run = "npm test"

[tasks."operator:deploy"]
description = "Build the operator and install it into the cluster"
dir = "{{config_root}}/packages/operator"
run = [
  "kubectl apply -f {{config_root}}/crds/",
  "npx pepr deploy --yes",
  "kubectl rollout status deployment/pepr-kmo -n pepr-system --timeout=180s",
  "kubectl rollout status deployment/pepr-kmo-watcher -n pepr-system --timeout=180s",
  "kubectl rollout status deployment/orders-api -n shop --timeout=120s",
]

[tasks."operator:logs"]
description = "Show the last ten minutes of the operator's watcher log"
run = "kubectl logs -n pepr-system deployment/pepr-kmo-watcher --since=10m"

[tasks."aws:issuer"]
description = "Create the bucket for the cluster's public signing keys in AWS and print the issuer address"
run = "test/e2e/aws/issuer.sh"

[tasks."aws:setup"]
description = "Prove a store without stored keys against a real AWS account (creates AWS resources)"
run = "test/e2e/aws/setup.sh"

[tasks."aws:teardown"]
description = "Remove everything aws:issuer and aws:setup created"
run = "test/e2e/aws/teardown.sh"

[tasks."check:rollout-guard"]
description = "Prove the guarded Rollout watch on the local cluster (removes and reinstalls Argo Rollouts)"
run = "test/e2e/rollout-guard.sh"

[tasks."test:e2e"]
description = "Run the end-to-end smoke test of the operator on the local cluster"
run = "test/e2e/smoke.sh"
