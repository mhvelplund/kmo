name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: mise run lint
      - run: mise run test
      - run: mise run infra:check
      - name: Build the chart
        run: charts/build.sh --image-registry "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
